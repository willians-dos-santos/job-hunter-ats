name: ATS Job Hunter Crawler

on:
  schedule:
    # Executa a cada 2 horas (de segunda a sexta) em horário UTC
    - cron: '0 */2 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente pela aba "Actions" do GitHub

concurrency:
  group: crawler-run
  cancel-in-progress: false

jobs:
  crawl:
    name: Run ATS Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar ambiente Python 3.11
        run: uv python install 3.11

      - name: Sincronizar dependências
        run: uv sync --frozen

      - name: Executar ciclo de coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: uv run python -m src.main