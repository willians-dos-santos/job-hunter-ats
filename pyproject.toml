[project]
name = "job-hunter-ats"
version = "0.1.0"
description = "Async ATS Job Crawler Core for Greenhouse and Lever APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "firebase-admin>=7.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.1",
    "supabase>=2.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
